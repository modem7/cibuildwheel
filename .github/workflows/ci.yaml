name: Build and upload wheels
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild and republish every wheel, even if already on the index
        type: boolean
        default: false
concurrency:
  group: pr-${{ github.ref == 'refs/heads/master' && github.run_number || github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_work: ${{ steps.plan.outputs.has_work }}
      cloudsmith_repo: ${{ steps.plan.outputs.cloudsmith_repo }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Install required Python packages
        run: python -m pip install -r scripts/requirements.txt pytest
      - name: Run tests
        run: python -m pytest -q tests
      - name: Plan missing wheels
        id: plan
        run: python scripts/wheels.py plan --github-output ${{ inputs.force && '--force' || '' }}

  build:
    name: ${{ matrix.recipe }} ${{ matrix.version }} ${{ matrix.arch }} (python ${{ matrix.python }})
    needs: plan
    if: ${{ needs.plan.outputs.has_work == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Install required Python packages
        run: python -m pip install -r scripts/requirements.txt
      - name: Build wheels
        env:
          RECIPE: ${{ matrix.recipe }}
          ARCH: ${{ matrix.arch }}
          PYTHONS: ${{ matrix.python }}
        run: python scripts/wheels.py build "$RECIPE" --arch "$ARCH" --python $PYTHONS
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: wheels-${{ matrix.recipe }}-${{ matrix.arch }}
          path: wheelhouse/
          if-no-files-found: error

  deploy:
    name: Deploy Wheels to Cloudsmith
    needs: [plan, build]
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && github.repository_owner == 'modem7' }}
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: wheels-*
          merge-multiple: true
          path: wheelhouse/
      - name: Install Cloudsmith CLI
        uses: cloudsmith-io/cloudsmith-cli-action@v3.1.1
        with:
          api-key: ${{ secrets.CLOUDSMITH_API_KEY }}
      - name: Push wheels to Cloudsmith
        env:
          CLOUDSMITH_REPO: ${{ needs.plan.outputs.cloudsmith_repo }}
        run: |
          for whl in wheelhouse/*.whl; do
            cloudsmith push python "$CLOUDSMITH_REPO" "$whl" --republish
          done
